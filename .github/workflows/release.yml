name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}

jobs:
    release:
        # Package on macOS so the shared npm preparation step can sign Darwin binaries.
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - name: Verify tag matches package version
              run: |
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  PACKAGE_VERSION="$(node -p "require('./cli/package.json').version")"
                  test "$VERSION" = "$PACKAGE_VERSION"
            - run: bun run build:single-exe:all
            - run: bun run --cwd cli prepare-npm-packages
            - name: Package release artifacts
              run: |
                  mkdir -p cli/release-artifacts
                  for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
                      name="hapi-${platform}"
                      if [[ "$platform" == "linux-x64" ]]; then
                          name="${name}-baseline"
                      fi
                      if [[ "$platform" == "win32-x64" ]]; then
                          zip -j "cli/release-artifacts/${name}.zip" "cli/npm/${platform}/bin/hapi.exe"
                      else
                          tar -czvf "cli/release-artifacts/${name}.tar.gz" -C "cli/npm/${platform}/bin" hapi
                      fi
                  done

                  cd cli/release-artifacts
                  shasum -a 256 *.tar.gz *.zip > checksums.txt
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF#refs/tags/}" \
                      --title "Release ${GITHUB_REF#refs/tags/}" \
                      --generate-notes \
                      cli/release-artifacts/*
